# Географическая привязка утверждений.
#
# Регион утверждения определяется по упоминаниям в тексте фрагмента-источника:
# название страны, её предприятий или городов однозначно относит описанную
# практику к этой стране. Гранулярность — страна: требование ТЗ формулируется
# как «отечественная практика против зарубежной», поэтому Норильск и Кольский
# полуостров считаются маркерами России, а не отдельными регионами.
#
# Маркер сопоставляется как НАЧАЛО слова без учёта регистра (ё приводится к е),
# поэтому «росси» покрывает «России», «российский», «россиян». Маркеры длиннее
# и специфичнее общеупотребительных слов: короткий маркер даст ложные
# срабатывания (например «инди» совпало бы с «индивидуальных»).
#
# domestic: true ровно у одной записи — она отвечает на «отечественная
# практика», все прочие составляют «зарубежную» (см. graph_traversal).

- name: Россия
  domestic: true
  markers: [росси, отечествен, норильск, талнах, надеждинск, заполярный филиал,
            кольск, мончегорск, печенг, красноярск, nornik, norilsk]

